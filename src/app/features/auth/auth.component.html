<section class="auth-shell">
  <div class="auth-wrap">
    <div class="auth-card">
      <header class="auth-header">
        <img
          ngSrc="assets/logo.jpeg"
          width="155"
          height="80"
          alt="Al-Ittihad Al-Watani"
          priority
          class="auth-logo"
        />
        <p class="brand-name">AI Email Agent</p>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in with your Microsoft account to continue</p>
      </header>

      @if (errorMessage) {
        <div class="feedback error">
          <strong>Sign-in failed</strong>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <div class="auth-actions">
        <button
          type="button"
          class="microsoft-button"
          [disabled]="loading"
          (click)="signInWithMicrosoft()"
        >
          @if (!loading) {
            <svg
              class="ms-logo"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 21 21"
              aria-hidden="true"
            >
              <rect x="1" y="1" width="9" height="9" fill="#f25022" />
              <rect x="11" y="1" width="9" height="9" fill="#7fba00" />
              <rect x="1" y="11" width="9" height="9" fill="#00a4ef" />
              <rect x="11" y="11" width="9" height="9" fill="#ffb900" />
            </svg>
          }
          @if (loading) {
            <svg
              class="spinner"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
          }
          {{ loading ? 'Signing in...' : 'Sign in with Microsoft' }}
        </button>
      </div>
    </div>
  </div>
</section>
